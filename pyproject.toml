[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lenseff"
version = "0.1.0.dev0"
description = "Detection efficiency for planetary microlensing surveys via injection-recovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcus Mitchell", email = "marcus.mitchell814@gmail.com" }]
keywords = ["microlensing", "exoplanets", "detection-efficiency", "Roman", "astronomy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "MulensModel>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
docs = ["jupyter>=1.0", "nbconvert>=7.0"]

[project.scripts]
lenseff = "lenseff.cli:main"

[project.urls]
Homepage = "https://github.com/mmitchelltx/lenseff"
Source = "https://github.com/mmitchelltx/lenseff"
Issues = "https://github.com/mmitchelltx/lenseff/issues"

[tool.hatch.build.targets.wheel]
packages = ["lenseff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lenseff", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "C4",        # flake8-comprehensions
  "SIM",       # flake8-simplify
  "PTH",       # flake8-use-pathlib
  "RET",       # flake8-return
  "ARG",       # unused arguments
  "NPY",       # numpy-specific
  "D",         # pydocstyle
  "ANN",       # flake8-annotations
  "RUF",
]
ignore = [
  "D107",    # __init__ docstring (documented at class level)
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "ANN401",  # Any is occasionally the honest annotation for raw YAML
  "N803",    # scientific parameter names (u_0, t_E) are not snake_case-pure
  "N806",
  "N815",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:MulensModel.*"]
markers = [
  "slow: long-running injection-recovery tests (deselect with '-m \"not slow\"')",
  "validation: scientific validation tests that must pass in CI",
]

[tool.mypy]
python_version = "3.11"
files = ["lenseff"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
